<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Groundwork Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2333291a'/%3E%3Cg fill='%23fbf6e9'%3E%3Crect x='6' y='6' width='19' height='6'/%3E%3Crect x='6' y='6' width='6' height='20'/%3E%3Crect x='6' y='20' width='19' height='6'/%3E%3Crect x='18' y='15' width='7' height='5'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#a8672a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
<div class="wrap">
  <h1><span class="mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><g fill="#fbf6e9"><rect x="4" y="4" width="15" height="4.5"/><rect x="4" y="4" width="4.5" height="16"/><rect x="4" y="15.5" width="15" height="4.5"/><rect x="14" y="11.5" width="5" height="4.5"/></g></svg></span>Groundwork Admin</h1>
  <p class="sub">Signup and activity counts only. Nothing about what anyone tracks.</p>

  <div id="screen-auth" class="center-screen" style="display:none;">
    <div class="card">
      <button class="btn google" id="google-signin">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.9 6.1C12.3 13 17.6 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.6c-.5 3-2.2 5.5-4.7 7.2l7.4 5.7C43.9 37.6 46.5 31.6 46.5 24.5z"/>
          <path fill="#FBBC05" d="M10.4 19.3c-.5 1.5-.8 3.1-.8 4.7s.3 3.2.8 4.7l-7.9 6.1C.9 31.6 0 28.1 0 24s.9-7.6 2.5-10.8l7.9 6.1z"/>
          <path fill="#34A853" d="M24 48c6.4 0 11.9-2.1 15.8-5.9l-7.4-5.7c-2.1 1.4-4.9 2.3-8.4 2.3-6.4 0-11.7-3.5-13.6-9.3l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
    </div>
  </div>

  <div id="screen-denied" class="center-screen" style="display:none;">
    <div class="card">
      <p class="sub" style="margin:0;">Signed in as <span id="denied-email"></span>. This page is only visible to the site owner.</p>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="tabs">
      <div class="tab active" data-tab="overview">Overview</div>
      <div class="tab" data-tab="blog">Blog</div>
    </div>

    <div class="panel active" id="panel-overview">
      <div class="stats" id="admin-stats"></div>
      <div class="card"><div class="toprow"><strong>Signups, last 30 days</strong></div><canvas id="chart-signups"></canvas></div>
      <div class="card"><div class="toprow"><strong>Most recent signups</strong></div><div id="admin-list"></div></div>
      <p class="hint" id="admin-error" style="color:var(--danger);"></p>
    </div>

    <div class="panel" id="panel-blog">
      <div class="card" id="blog-list-card">
        <div class="toprow"><strong>Posts</strong><button class="btn small" id="post-new-btn">+ New post</button></div>
        <div id="blog-list"></div>
      </div>

      <div class="card" id="post-editor-card" style="display:none;">
        <div class="row">
          <div><label>Title</label><input type="text" id="post-title" placeholder="Post title"></div>
          <div><label>Slug</label><input type="text" id="post-slug" placeholder="post-slug"></div>
        </div>
        <label>Meta description <span id="post-meta-count" class="hint" style="display:inline;"></span></label>
        <textarea id="post-meta-description" style="min-height:60px;" placeholder="Shown in search results. Aim for 120 to 160 characters."></textarea>
        <div class="row">
          <div><label>Focus keyphrase</label><input type="text" id="post-keyphrase" placeholder="e.g. habit tracking"></div>
          <div><label>Related keywords (comma separated)</label><input type="text" id="post-related" placeholder="e.g. routine, streak, consistency"></div>
        </div>
        <label>Cover image URL</label>
        <input type="text" id="post-cover" placeholder="https://...">
        <label>Body (Markdown, with raw HTML allowed inline)</label>
        <textarea id="post-body" style="min-height:320px;font-family:ui-monospace,Consolas,monospace;font-size:.85rem;" placeholder="Write the post here..."></textarea>

        <div class="card" style="background:var(--panel2);margin-top:16px;">
          <div class="toprow"><strong>SEO &amp; readability</strong><span id="seo-summary"></span></div>
          <div id="seo-checks"></div>
        </div>

        <div class="footer-actions">
          <button class="btn secondary" id="post-cancel-btn">Cancel</button>
          <button class="btn secondary" id="post-save-draft-btn">Save draft</button>
          <button class="btn" id="post-publish-btn">Publish</button>
          <button class="btn danger" id="post-delete-btn" style="display:none;margin-left:auto;">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="admin.js"></script>
</body>
</html>
